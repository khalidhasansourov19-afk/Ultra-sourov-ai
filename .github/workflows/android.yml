name: Build Android APK, তারপর on: push branches main, pull_request branches main, workflow_dispatch; permissions: contents read; jobs: build, runs-on: ubuntu-latest; steps: actions/checkout@v4, actions/setup-java@v4 দিয়ে Temurin Java 17 সেট করো, তারপর required files চেক করো, chmod দিয়ে gradlew executable করো, ./gradlew assembleDebug দিয়ে build করো, শেষে actions/upload-artifact@v4 দিয়ে APK upload করো,
